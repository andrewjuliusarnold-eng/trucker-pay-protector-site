<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Email Confirmed: Trucker Pay Protector</title>
<meta name="description" content="Your Trucker Pay Protector email is confirmed. Open the app to continue.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F5F3; --surface:#FFFFFF; --ink:#12161A; --muted:#5B6570; --line:#DADFDC;
  --accent:#17664A; --accent-ink:#FFFFFF; --accent-fill:#E1F0E8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1013; --surface:#171A1E; --ink:#EDEFEC; --muted:#98A0A8; --line:#2B2F34;
    --accent:#7FD1A8; --accent-ink:#0E1013; --accent-fill:#123626;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:16px;font-size:16px;line-height:1.6;min-height:100%;display:flex;flex-direction:column}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:28px;flex:1;width:100%}
h1{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;font-size:clamp(28px,6vw,38px);font-weight:800}
p{margin:0}
a{color:var(--accent)}

nav{display:flex;align-items:center;justify-content:center;padding-block:20px 0}
.brand{display:flex;align-items:center}
.brand img{height:26px;width:auto;display:block}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:32px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:999px;background:var(--accent-fill);color:var(--accent);font-size:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;font-size:14.5px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:24px;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a class="brand" href="/" aria-label="Trucker Pay Protector">
      <picture>
        <source srcset="/assets/lockup-night.svg" media="(prefers-color-scheme: dark)">
        <img src="/assets/lockup-day.svg" alt="Trucker Pay Protector">
      </picture>
    </a>
  </nav>

  <main>
    <div class="badge">&#10003;</div>
    <h1>Email confirmed</h1>
    <p>Open Trucker Pay Protector to continue.</p>
    <div class="card">Testing the beta? The app opens this page automatically once you're signed in on your phone. If nothing happened, just switch back to the app yourself.</div>
  </main>

  <footer>
    <p><a href="/">Trucker Pay Protector</a> · <a href="/privacy/">Privacy Policy</a> · <a href="/terms/">Terms of Service</a></p>
  </footer>

</div>
</body>
</html>
